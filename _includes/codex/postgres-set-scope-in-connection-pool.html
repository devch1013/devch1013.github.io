<figure class="cdxsc" data-setscope>
<style>
.cdxsc {
  --ink:#22303c;
  --rule:#dce2e8;
  --off:#8a94a0;
  --on:#b4531f;
  --copy:#2f6f8f;
  --bad:#a3122b;
  --good:#1d6b4f;
  --k:4.6rem;
  --slot:64px;
  margin: 1.6em 0;
  padding: 0;
  color: var(--ink);
  font-size: .92rem;
  line-height: 1.55;
}
.cdxsc-mono {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
.cdxsc-lede {
  margin: 0 0 .7em;
}
.cdxsc-lede b {
  font-weight: 600;
  border-bottom: 2px solid var(--copy);
}
.cdxsc-key {
  margin: 0 0 1.1em;
  padding: .55em .7em;
  border: 1px solid var(--rule);
  font-size: .84rem;
  line-height: 1.9;
}
.cdxsc-key-row + .cdxsc-key-row {
  margin-top: .15em;
}
.cdxsc-key-item {
  display: inline-block;
  margin-right: 1.1em;
  white-space: nowrap;
}
.cdxsc-chip {
  display: inline-block;
  min-width: 2.1em;
  padding: 0 .3em;
  text-align: center;
  font-style: normal;
  font-size: .78rem;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  border: 1px solid var(--rule);
  vertical-align: 1px;
}
.cdxsc-chip.is-on  { color: #fff; background: var(--on); border-color: var(--on); }
.cdxsc-chip.is-off { color: var(--off); background: #fff; }
.cdxsc-chip.is-none {
  color: var(--off);
  background: repeating-linear-gradient(135deg, #fff, #fff 3px, #eef1f4 3px, #eef1f4 6px);
}
.cdxsc-good { color: var(--good); font-weight: 700; }
.cdxsc-bad  { color: var(--bad);  font-weight: 700; }
.cdxsc-arrowkey { color: var(--copy); font-weight: 700; }

.cdxsc-scroll { overflow-x: auto; }
.cdxsc-grid {
  min-width: calc(var(--k) + 8 * var(--slot));
}
.cdxsc-row {
  display: grid;
  grid-template-columns: var(--k) repeat(8, minmax(var(--slot), 1fr));
  align-items: stretch;
}
.cdxsc-scope {
  align-self: center;
  padding-right: .5em;
  text-align: right;
  font-size: .78rem;
  color: var(--off);
}

/* --- 공유 축 헤더 --- */
.cdxsc-axis {
  padding-bottom: .3em;
  border-bottom: 2px solid var(--ink);
}
.cdxsc-span {
  padding: .1em .4em;
  font-size: .78rem;
  color: var(--ink);
  border-bottom: 1px solid var(--rule);
}
.cdxsc-span.t1 { grid-column: 2 / 6; }
.cdxsc-span.t2 { grid-column: 6 / 9; }
.cdxsc-span.t3 { grid-column: 9 / 10; color: var(--off); }
.cdxsc-slot {
  padding: .35em .3em 0;
  font-size: .76rem;
  text-align: center;
}
.cdxsc-slot-sub {
  display: block;
  font-size: .68rem;
  color: var(--off);
}
.cdxsc-slot.aim .cdxsc-slot-sub { color: var(--ink); }
.cdxsc-slot.aim { border: 1px dashed var(--ink); border-bottom: 0; }

/* --- 패널 --- */
.cdxsc-panel {
  padding: .9em 0 1em;
  border-bottom: 1px solid var(--rule);
}
.cdxsc-panel:last-child { border-bottom: 0; }
.cdxsc-stmt {
  margin: 0 0 .5em;
  font-size: .84rem;
  line-height: 1.5;
}
.cdxsc-stmt code {
  padding: .05em .3em;
  background: #f2f5f7;
  border: 0;
  font-size: .84rem;
}
.cdxsc-end {
  margin-left: .5em;
  font-size: .74rem;
  color: var(--off);
}

.cdxsc-cell {
  margin: 1px;
  padding: .18em 0;
  text-align: center;
  font-size: .76rem;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  border: 1px solid var(--rule);
}
.cdxsc-cell.is-on   { color: #fff; background: var(--on); border-color: var(--on); }
.cdxsc-cell.is-off  { color: var(--off); background: #fff; }
.cdxsc-cell.is-none {
  color: #b7bfc7;
  border-style: dotted;
  background: repeating-linear-gradient(135deg, #fff, #fff 3px, #eef1f4 3px, #eef1f4 6px);
}

.cdxsc-copyrow { min-height: 2.1em; }
.cdxsc-copy {
  align-self: start;
  text-align: center;
  font-size: .7rem;
  line-height: 1.15;
  color: var(--copy);
}
.cdxsc-copy::before {
  content: "";
  display: block;
  width: 0;
  height: .7em;
  margin: 0 auto;
  border-left: 2px solid currentColor;
}
.cdxsc-copy .cdxsc-carry {
  display: block;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
.cdxsc-copy.carries-on { color: var(--on); font-weight: 700; }

.cdxsc-mark {
  padding-top: .3em;
  text-align: center;
  font-size: .72rem;
  line-height: 1.3;
}
.cdxsc-mark.ok  { color: var(--good); }
.cdxsc-mark.bad { color: var(--bad); }
.cdxsc-mark b { display: block; font-weight: 700; }
.cdxsc-mark span { display: block; font-size: .68rem; }

.cdxsc-note {
  margin: .7em 0 0;
  padding-left: .6em;
  font-size: .84rem;
  border-left: 3px solid var(--rule);
}
.cdxsc-panel.is-answer .cdxsc-note { border-left-color: var(--good); }
.cdxsc-panel.is-bug .cdxsc-note { border-left-color: var(--bad); }

.cdxsc-cap {
  margin-top: 1em;
  font-size: .82rem;
  color: var(--off);
}
.cdxsc-cap code { font-size: .8rem; }

/* JS 없이도 성립 */
.cdxsc-fallback {
  width: 100%;
  margin: 0;
  font-size: .82rem;
}
.cdxsc.js .cdxsc-fallback { display: none; }
.cdxsc:not(.js) .cdxsc-scroll { display: none; }

@media (max-width: 640px) {
  .cdxsc { --k:3.4rem; --slot:56px; font-size: .88rem; }
}
</style>

<p class="cdxsc-lede">트랜잭션의 읽기전용 플래그는 <b>BEGIN 순간에 세션 기본값을 한 번 복사</b>해 오고 그걸로 끝이다. 넉 장을 세로로 훑으면서 <b>▼ 가 무엇을 실어 내리는지</b>만 보면 된다.</p>

<div class="cdxsc-key">
  <div class="cdxsc-key-row">
    <span class="cdxsc-key-item">위 칸 <span class="cdxsc-mono">세션</span> = <code class="cdxsc-mono">default_transaction_read_only</code> — 커넥션이 끊길 때까지 산다</span>
  </div>
  <div class="cdxsc-key-row">
    <span class="cdxsc-key-item">아래 칸 <span class="cdxsc-mono">트랜잭션</span> = <code class="cdxsc-mono">transaction_read_only</code> — 실제로 쓰기를 거부하는 값</span>
  </div>
  <div class="cdxsc-key-row">
    <span class="cdxsc-key-item"><i class="cdxsc-chip is-on">on</i> 읽기전용</span>
    <span class="cdxsc-key-item"><i class="cdxsc-chip is-off">off</i> 아님</span>
    <span class="cdxsc-key-item"><i class="cdxsc-chip is-none">없음</i> 트랜잭션 밖 — 플래그 자체가 없다</span>
    <span class="cdxsc-key-item"><b class="cdxsc-arrowkey">▼</b> BEGIN 의 복사</span>
    <span class="cdxsc-key-item"><b class="cdxsc-good">✓</b><b class="cdxsc-bad">✗</b> 는 성공·실패가 아니라 <b>의도와 맞았는지</b></span>
  </div>
</div>

<div class="cdxsc-scroll">
  <div class="cdxsc-grid">
    <div class="cdxsc-axis">
      <div class="cdxsc-row">
        <span class="cdxsc-scope"></span>
        <span class="cdxsc-span t1">트랜잭션 1 — 읽기전용으로 만들려던 블록</span>
        <span class="cdxsc-span t2">트랜잭션 2 — 같은 커넥션을 물려받은 다음 요청</span>
        <span class="cdxsc-span t3">그 뒤</span>
      </div>
      <div class="cdxsc-row">
        <span class="cdxsc-scope"></span>
        <span class="cdxsc-slot">BEGIN</span>
        <span class="cdxsc-slot">구문</span>
        <span class="cdxsc-slot aim">쓰기<span class="cdxsc-slot-sub">막으려던 자리</span></span>
        <span class="cdxsc-slot">끝</span>
        <span class="cdxsc-slot">BEGIN</span>
        <span class="cdxsc-slot">쓰기<span class="cdxsc-slot-sub">상관없는 요청</span></span>
        <span class="cdxsc-slot">끝</span>
        <span class="cdxsc-slot">…</span>
      </div>
    </div>
    <div data-panels></div>
  </div>
</div>

<table class="cdxsc-fallback">
  <thead>
    <tr><th>구문</th><th>트랜잭션 1 의 쓰기</th><th>트랜잭션 2 의 쓰기</th><th>커넥션에 남나</th></tr>
  </thead>
  <tbody>
    <tr><td><code>SET default_transaction_read_only = true</code> + COMMIT</td><td>통과 (막지 못함)</td><td>거부 (남의 트랜잭션)</td><td>남는다</td></tr>
    <tr><td><code>SET default_transaction_read_only = true</code> + ROLLBACK</td><td>통과 (막지 못함)</td><td>통과</td><td>안 남는다</td></tr>
    <tr><td><code>SET LOCAL default_transaction_read_only = true</code></td><td>통과 (막지 못함)</td><td>통과</td><td>안 남는다</td></tr>
    <tr><td><code>SET TRANSACTION READ ONLY</code></td><td>거부 (의도대로)</td><td>통과</td><td>안 남는다</td></tr>
  </tbody>
</table>

<figcaption class="cdxsc-cap">
  아래 칸이 트랜잭션 밖에서 사라지는 것이 요점이다 — 트랜잭션 플래그는 남을 수가 없고, 커넥션에 남는 것은 언제나 위 칸뿐이다.
  <code class="cdxsc-mono">SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY</code> 는 이름만 다를 뿐 첫 장과 같은 그림이다.
</figcaption>

<script>
(function () {
  var root = document.currentScript.closest('[data-setscope]');
  if (!root) return;

  /* ===== scope-model:start ===== */
  // 커넥션 하나의 일생을 슬롯 8칸으로 훑으면서
  // 세션 기본값(top) 과 트랜잭션 플래그(bottom) 를 각각 기록한다.
  var SLOTS = ['begin1', 'stmt', 'write1', 'end1', 'begin2', 'write2', 'end2', 'after'];

  function traceScope(stmt, ending) {
    var sessionDefault = false;  // default_transaction_read_only — 세션에 산다
    var txFlag = null;           // transaction_read_only — 트랜잭션 안에서만 존재한다
    var localSet = false;        // SET LOCAL 로 바꾼 상태인가
    var top = [], bottom = [], arrows = [], marks = [];

    for (var i = 0; i < SLOTS.length; i++) {
      var s = SLOTS[i];
      if (s === 'begin1' || s === 'begin2') {
        txFlag = sessionDefault;                       // ← 복사는 여기서 딱 한 번
        arrows.push({ slot: i, carries: sessionDefault });
      } else if (s === 'stmt') {
        if (stmt === 'set') {
          sessionDefault = true;
        } else if (stmt === 'setlocal') {
          sessionDefault = true; localSet = true;
        } else if (stmt === 'settx') {
          txFlag = true;                               // 현재 플래그를 직접 쓴다
        }
      } else if (s === 'write1' || s === 'write2') {
        var rejected = txFlag === true;
        var intended = (s === 'write1');               // 막으려던 자리는 첫 트랜잭션뿐
        marks.push({
          slot: i,
          rejected: rejected,
          intended: intended,
          ok: rejected === intended,
          kind: intended
            ? (rejected ? 'intended' : 'noguard')
            : (rejected ? 'collateral' : 'normal')
        });
      } else if (s === 'end1') {
        // SET 은 롤백 대상이고, SET LOCAL 은 트랜잭션이 끝나면 되돌아간다
        if (ending === 'rollback' || localSet) sessionDefault = false;
        localSet = false;
        txFlag = null;
      } else if (s === 'end2') {
        txFlag = null;
      }
      top.push(sessionDefault);
      bottom.push(txFlag);
    }
    return { slots: SLOTS, top: top, bottom: bottom, arrows: arrows, marks: marks };
  }
  /* ===== scope-model:end ===== */

  var MARK_TEXT = {
    intended:   ['✓ 쓰기 거부', '의도대로'],
    noguard:    ['✗ 쓰기 통과', '가드 무동작'],
    collateral: ['✗ 쓰기 거부', '무관한 요청이 죽는다'],
    normal:     ['✓ 쓰기 통과', '정상']
  };

  var PANELS = [
    { stmt: 'set', ending: 'commit', tone: 'is-bug',
      sql: 'SET default_transaction_read_only = true', end: 'COMMIT',
      note: '겨눈 트랜잭션은 뚫리고, 커넥션에 남은 값이 상관없는 다음 트랜잭션을 죽인다. 정확히 반대로 동작한다.' },
    { stmt: 'set', ending: 'rollback', tone: '',
      sql: 'SET default_transaction_read_only = true', end: 'ROLLBACK',
      note: '같은 구문인데 롤백이면 아무것도 남지 않는다. SET 이 트랜잭션적이라서다 — 이 버그가 간헐적으로 보이는 이유이자, 롤백 경로로 재현하면 헛짚는 이유.' },
    { stmt: 'setlocal', ending: 'commit', tone: '',
      sql: 'SET LOCAL default_transaction_read_only = true', end: 'COMMIT',
      note: '오염은 사라졌는데 겨눈 자리는 여전히 뚫려 있다. 누수만 고치고 원래 의도는 놓친 반쪽짜리.' },
    { stmt: 'settx', ending: 'commit', tone: 'is-answer',
      sql: 'SET TRANSACTION READ ONLY', end: 'COMMIT',
      note: '복사를 기다리지 않고 아래 칸에 직접 쓴다. 위 칸은 한 번도 켜지지 않으므로 커넥션에 남을 것도 없다.' }
  ];

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function cellsRow(scope, cells) {
    return '<div class="cdxsc-row"><span class="cdxsc-scope">' + esc(scope) + '</span>' +
      cells.join('') + '</div>';
  }

  function renderPanel(cfg) {
    var m = traceScope(cfg.stmt, cfg.ending);
    var i, html = '';

    var topCells = [], botCells = [], copyCells = [], markCells = [];
    for (i = 0; i < m.slots.length; i++) {
      topCells.push('<span class="cdxsc-cell ' + (m.top[i] ? 'is-on' : 'is-off') + '">' +
        (m.top[i] ? 'on' : 'off') + '</span>');
      botCells.push(m.bottom[i] === null
        ? '<span class="cdxsc-cell is-none">없음</span>'
        : '<span class="cdxsc-cell ' + (m.bottom[i] ? 'is-on' : 'is-off') + '">' +
          (m.bottom[i] ? 'on' : 'off') + '</span>');
      copyCells.push('<span></span>');
      markCells.push('<span></span>');
    }
    for (i = 0; i < m.arrows.length; i++) {
      var a = m.arrows[i];
      copyCells[a.slot] = '<span class="cdxsc-copy' + (a.carries ? ' carries-on' : '') + '">▼' +
        '<span class="cdxsc-carry">' + (a.carries ? 'on' : 'off') + '</span></span>';
    }
    for (i = 0; i < m.marks.length; i++) {
      var k = m.marks[i];
      var t = MARK_TEXT[k.kind];
      markCells[k.slot] = '<span class="cdxsc-mark ' + (k.ok ? 'ok' : 'bad') + '">' +
        '<b>' + t[0] + '</b><span>' + t[1] + '</span></span>';
    }

    html += '<section class="cdxsc-panel ' + cfg.tone + '">';
    html += '<p class="cdxsc-stmt"><code class="cdxsc-mono">' + esc(cfg.sql) + '</code>' +
      '<span class="cdxsc-end">끝: ' + esc(cfg.end) + '</span></p>';
    html += cellsRow('세션', topCells);
    html += '<div class="cdxsc-row cdxsc-copyrow"><span class="cdxsc-scope"></span>' +
      copyCells.join('') + '</div>';
    html += cellsRow('트랜잭션', botCells);
    html += '<div class="cdxsc-row"><span class="cdxsc-scope"></span>' + markCells.join('') + '</div>';
    html += '<p class="cdxsc-note">' + esc(cfg.note) + '</p>';
    html += '</section>';
    return html;
  }

  var host = root.querySelector('[data-panels]');
  host.innerHTML = PANELS.map(renderPanel).join('');
  root.classList.add('js');
})();
</script>
</figure>
