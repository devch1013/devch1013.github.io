<figure class="cdxslot">
<style>
.cdxslot {
  --loop:#1a6b57; --loop-s:#e8f2ef;
  --dead:#a8322f; --dead-s:#fbeceb;
  --temp:#8a6a12; --temp-s:#fbf3df;
  --defer:#3a55a0; --defer-s:#eaeefa;
  --wall:#6f7780; --ink:#242a2f;
  margin:1.9rem 0;
  padding:0;
}
.cdxslot .cdxslot-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.cdxslot .cdxslot-svg {
  display:block;
  width:100%;
  min-width:740px;
  height:auto;
  font-family:inherit;
  color:var(--ink);
}
.cdxslot .cdxslot-mono { font-family:Menlo,Consolas,"Liberation Mono",monospace; }
.cdxslot .cdxslot-cap {
  margin:.75rem .1rem 0;
  font-size:.86rem;
  line-height:1.65;
  color:#4a5560;
}
.cdxslot .cdxslot-cap b { color:var(--ink); font-weight:600; }
.cdxslot .cdxslot-cap code {
  font-family:Menlo,Consolas,"Liberation Mono",monospace;
  font-size:.82em;
}
</style>

<div class="cdxslot-scroll">
<svg class="cdxslot-svg" viewBox="0 0 800 416" role="img"
     aria-labelledby="cdxslot-t cdxslot-d" preserveAspectRatio="xMidYMid meet">
  <title id="cdxslot-t">스레드마다 하나씩 있는 &ldquo;도는 루프 자리&rdquo; 단면도</title>
  <desc id="cdxslot-d">왼쪽은 이벤트 루프 스레드로, 루프 자리가 도는 이벤트 루프로 채워져 있어 asyncio.create_task 가 코루틴을 태스크로 등록한다. 오른쪽은 def 핸들러가 오프로드되는 anyio 워커 스레드로, 루프 자리가 비어 있다. 그 자리를 읽기만 하는 create_task 는 RuntimeError 로 막히고 코루틴은 never awaited 로 사라진다. asyncio.run 은 임시 루프를 만들어 그 자리에 꽂아 완주시키지만 그동안 응답이 나가지 못한다. BackgroundTasks 는 그 자리를 아예 보지 않고, 응답이 나간 뒤에 실행하도록 시점만 옮긴다.</desc>

  <defs>
    <marker id="cdxslot-ar-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1a6b57"/>
    </marker>
    <marker id="cdxslot-ar-dead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#a8322f"/>
    </marker>
    <marker id="cdxslot-ar-temp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#8a6a12"/>
    </marker>
    <marker id="cdxslot-ar-defer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#3a55a0"/>
    </marker>
  </defs>

  <!-- ============ 왼쪽 방 : 이벤트 루프 스레드 ============ -->
  <g class="cdxslot-room">
    <rect x="8" y="8" width="252" height="400" rx="12" fill="#fdfdfc" stroke="#c9ced4"/>
    <text x="24" y="36" font-size="14.5" font-weight="700" fill="#242a2f">이벤트 루프 스레드</text>
    <text x="24" y="55" font-size="11.5" fill="#6f7780">async def 핸들러가 여기서 실행</text>
    <line x1="24" y1="68" x2="244" y2="68" stroke="#e2e5e8"/>

    <rect x="24" y="84" width="220" height="32" rx="7" fill="#ffffff" stroke="#cfd4d8"/>
    <text class="cdxslot-mono" x="134" y="105" font-size="11.5" text-anchor="middle" fill="#242a2f">asyncio.create_task(coro)</text>

    <line x1="134" y1="118" x2="134" y2="156" stroke="#1a6b57" stroke-width="1.8" marker-end="url(#cdxslot-ar-loop)"/>

    <rect x="30" y="162" width="208" height="104" rx="12" fill="#e8f2ef" stroke="#1a6b57" stroke-width="1.6"/>
    <text x="134" y="185" font-size="11" text-anchor="middle" fill="#6f7780">이 스레드의 루프 자리</text>
    <rect x="46" y="196" width="176" height="40" rx="8" fill="#1a6b57"/>
    <text x="134" y="221" font-size="12.5" font-weight="600" text-anchor="middle" fill="#ffffff">도는 이벤트 루프</text>
    <text class="cdxslot-mono" x="134" y="254" font-size="10.5" text-anchor="middle" fill="#1a6b57">get_running_loop() → OK</text>

    <text x="24" y="292" font-size="11.5" font-weight="600" fill="#1a6b57">자리를 읽는다 → 태스크로 등록</text>
    <text x="24" y="310" font-size="11" fill="#4a5560">루프가 이 코루틴도 함께 굴린다</text>

    <text x="24" y="340" font-size="10.5" fill="#6f7780">단, 루프는 태스크를 약한 참조로 붙든다.</text>
    <text x="24" y="356" font-size="10.5" fill="#6f7780">반환값을 안 들고 있으면 GC 될 수 있다.</text>
  </g>

  <!-- ============ 오른쪽 방 : anyio 워커 스레드 ============ -->
  <g class="cdxslot-room">
    <rect x="276" y="8" width="516" height="400" rx="12" fill="#fdfdfc" stroke="#c9ced4"/>
    <text x="292" y="36" font-size="14.5" font-weight="700" fill="#242a2f">anyio 워커 스레드</text>
    <text x="292" y="55" font-size="11.5" fill="#6f7780">def 핸들러가 여기서 실행 — 블로킹 대비 오프로드</text>
    <line x1="292" y1="68" x2="776" y2="68" stroke="#e2e5e8"/>

    <!-- 이 방의 루프 자리 : 비어 있음 -->
    <rect x="610" y="84" width="166" height="92" rx="12" fill="#ffffff" stroke="#6f7780" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="693" y="107" font-size="11" text-anchor="middle" fill="#6f7780">이 스레드의 루프 자리</text>
    <text x="693" y="134" font-size="15" font-weight="700" text-anchor="middle" fill="#a8322f">비어 있음</text>
    <text class="cdxslot-mono" x="693" y="157" font-size="10.5" text-anchor="middle" fill="#a8322f">get_running_loop() ✕</text>

    <!-- run 이 만들어 꽂는 임시 루프 -->
    <rect x="610" y="208" width="166" height="40" rx="8" fill="#8a6a12"/>
    <text x="693" y="233" font-size="11.5" font-weight="600" text-anchor="middle" fill="#ffffff">임시 루프 — run 이 만듦</text>
    <line x1="693" y1="206" x2="693" y2="182" stroke="#8a6a12" stroke-width="1.8" marker-end="url(#cdxslot-ar-temp)"/>
    <text x="701" y="199" font-size="10" fill="#8a6a12">자리에 꽂는다</text>

    <!-- 응답 이후로 미뤄지는 실행 -->
    <rect x="610" y="288" width="166" height="48" rx="10" fill="#eaeefa" stroke="#3a55a0" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="693" y="309" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3a55a0">응답이 나간 뒤</text>
    <text x="693" y="327" font-size="10.5" text-anchor="middle" fill="#3a55a0">루프가 다시 워커로 보냄</text>
    <line x1="693" y1="286" x2="693" y2="256" stroke="#3a55a0" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#cdxslot-ar-defer)"/>
    <text x="701" y="275" font-size="10" fill="#3a55a0">그때 완주</text>

    <!-- 갈래 1 : create_task -->
    <rect x="292" y="84" width="264" height="30" rx="7" fill="#fbeceb" stroke="#a8322f" stroke-width="1.2"/>
    <text class="cdxslot-mono" x="302" y="104" font-size="11.5" fill="#242a2f">asyncio.create_task(coro)</text>
    <line x1="558" y1="99" x2="592" y2="114" stroke="#a8322f" stroke-width="1.8" marker-end="url(#cdxslot-ar-dead)"/>
    <circle cx="606" cy="120" r="9.5" fill="#ffffff" stroke="#a8322f" stroke-width="1.6"/>
    <text x="606" y="124" font-size="11" font-weight="700" text-anchor="middle" fill="#a8322f">✕</text>
    <text x="292" y="134" font-size="11.5" font-weight="600" fill="#a8322f">자리를 읽기만 한다 → RuntimeError</text>
    <text x="292" y="152" font-size="11" fill="#4a5560">코루틴은 태워지지도 못한 채 GC 된다</text>
    <text class="cdxslot-mono" x="292" y="169" font-size="10" fill="#6f7780">never awaited 경고의 정체</text>

    <!-- 갈래 2 : asyncio.run -->
    <rect x="292" y="196" width="264" height="30" rx="7" fill="#fbf3df" stroke="#8a6a12" stroke-width="1.2"/>
    <text class="cdxslot-mono" x="302" y="216" font-size="11.5" fill="#242a2f">asyncio.run(coro)</text>
    <line x1="558" y1="211" x2="602" y2="224" stroke="#8a6a12" stroke-width="1.8" marker-end="url(#cdxslot-ar-temp)"/>
    <text x="292" y="246" font-size="11.5" font-weight="600" fill="#8a6a12">빈 자리를 임시로 채워 완주시킨다</text>
    <text x="292" y="264" font-size="11" fill="#4a5560">대신 이 줄이 끝날 때까지 응답이 못 나간다</text>

    <!-- 갈래 3 : BackgroundTasks -->
    <rect x="292" y="296" width="264" height="30" rx="7" fill="#eaeefa" stroke="#3a55a0" stroke-width="1.2"/>
    <text class="cdxslot-mono" x="302" y="316" font-size="11.5" fill="#242a2f">background_tasks.add_task(...)</text>
    <line x1="558" y1="311" x2="602" y2="311" stroke="#3a55a0" stroke-width="1.8" marker-end="url(#cdxslot-ar-defer)"/>
    <text x="292" y="346" font-size="11.5" font-weight="600" fill="#3a55a0">자리를 아예 보지 않는다</text>
    <text x="292" y="364" font-size="11" fill="#4a5560">실행 시점만 응답 뒤로 옮길 뿐,</text>
    <text x="292" y="381" font-size="11" fill="#4a5560">굴리는 도구는 결국 위의 임시 루프다</text>
  </g>
</svg>
</div>

<figcaption class="cdxslot-cap">
  <code>create_task</code> 는 넘겨받은 코루틴을 보지 않는다 — <b>자기가 선 스레드의 루프 자리</b>를 볼 뿐이다.
  그 자리는 스레드마다 따로 파여 있고, <code>def</code> 핸들러가 오프로드된 워커 스레드에서는 비어 있다.
  빈 자리 앞에서 남는 선택지는 둘뿐이다: 임시 루프로 <b>지금 채우거나</b>(응답을 붙잡는 대가),
  채우는 일을 <b>응답 뒤로 미루거나</b>.
</figcaption>
</figure>
